global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # CV Platform API metrics
  - job_name: "cv-platform-api"
    static_configs:
      - targets: ["host.docker.internal:8080"] # Adjust port if different
    scrape_interval: 5s
    metrics_path: /metrics
    scrape_timeout: 5s

  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Node Exporter (system metrics)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
